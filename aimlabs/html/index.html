<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aim Labs</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- In-game HUD -->
    <div id="hud-container">
        <div class="hud-item">
            <span>SCORE</span>
            <p id="score">0</p>
        </div>
        <div class="hud-item">
            <span>TIME</span>
            <p id="timer">60</p>
        </div>
    </div>

    <!-- Main UI Container -->
    <div id="main-ui-container">
        <!-- Main Menu -->
        <div id="menu-container" class="ui-panel">
            <div class="panel-header">
                <h1>AIM LABS</h1>
            </div>
            <div class="panel-content">
                <h2>Wähle einen Modus</h2>
                <div class="mode-selection">
                    <button class="start-game-btn" data-mode="gridshot">Gridshot</button>
                    <button class="start-game-btn" data-mode="tracking">Tracking</button>
                </div>

                <div class="settings-section">
                    <h3>Einstellungen</h3>
                    <div class="setting">
                        <label for="target-size">Zielgröße</label>
                        <input type="range" id="target-size" min="0.5" max="2.0" value="1.0" step="0.1">
                        <span id="target-size-value">1.0x</span>
                    </div>
                </div>

                <div id="highscore-section">
                    <h3>Highscores</h3>
                    <div class="highscore-box" id="highscore-gridshot">
                        <h4>Gridshot</h4>
                        <div class="highscore-list"></div>
                    </div>
                    <div class="highscore-box" id="highscore-tracking">
                        <h4>Tracking</h4>
                        <div class="highscore-list"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Results Screen -->
        <div id="results-container" class="ui-panel">
             <div class="panel-header">
                <h1>Ergebnis</h1>
            </div>
            <div class="panel-content results-content">
                <p>Finaler Score:</p>
                <h2 id="final-score">0</h2>
                <button id="close-results">Schließen</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
